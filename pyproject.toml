[project]
name = "tracking"
version = "0.1.0"
description = "A lightweight, backend-agnostic experiment tracking and grid-sweep driver for numerical experiments, backed by Sacred."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Niklas Paulicks", email = "nPaulicks@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymongo>=4.18.2",
    "sacred==0.8.7",
    "setuptools<81",  # sacred 0.8.7 imports pkg_resources, removed in setuptools>=81
    "pyinstrument>=5.1.2",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
