[project]
name = "tracking"
version = "0.1.0"
description = "A lightweight, backend-agnostic experiment tracking and grid-sweep driver for numerical experiments, backed by a vendored copy of Sacred."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Niklas Paulicks", email = "nPaulicks@gmail.com" }
]
dependencies = [
    "certifi>=2026.7.22",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymongo>=4.18.2",
    "pyinstrument>=5.1.2",
    "tenacity>=9.1.4",
    # Runtime dependencies of the vendored Sacred copy
    # (see src/tracking/_vendor/README.md). Formerly pulled in
    # transitively via the `sacred` package.
    "GitPython>=3.0",
    "colorama>=0.4",
    "docopt-ng>=0.9",
    "jsonpickle>=2.2.0",
    "munch>=2.5,<5.0",
    "packaging>=18.0",
    "py-cpuinfo>=4.0",
    "wrapt>=1.0,<2.0",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
