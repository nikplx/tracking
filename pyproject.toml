[project]
name = "tracking"
version = "0.1.0"
description = "A lightweight experiment tracking and grid-sweep driver for numerical experiments, backed by a compact MongoDB document per run."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Niklas Paulicks", email = "nPaulicks@gmail.com" }
]
dependencies = [
    "certifi>=2026.7.22",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymongo>=4.18.2",
    "pyinstrument>=5.1.2",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]

[dependency-groups]
dev = ["boto3-stubs~=1.43.123"]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
